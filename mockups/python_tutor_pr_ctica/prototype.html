<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Práctica · prototipo visual</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #68738a;
        --line: #e5e9f0;
        --paper: #ffffff;
        --wash: #f6f8fb;
        --accent: #e64a45;
        --accent-soft: #fff0ee;
        --success: #15803d;
        --success-soft: #ecfdf3;
        --warning: #a16207;
        --warning-soft: #fff8e6;
        --shadow: 0 22px 60px rgba(23, 32, 51, 0.1);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: #eef1f5; }
      button, textarea { font: inherit; }
      button { cursor: pointer; }
      .prototype-note {
        position: fixed; z-index: 4; top: 12px; left: 50%; transform: translateX(-50%);
        border: 1px solid #f3c9c6; background: #fff8f7; color: #a53b36;
        border-radius: 999px; padding: 7px 13px; font-size: 11px; font-weight: 800;
        letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 8px 24px rgba(165,59,54,.12);
      }
      .app { width: min(1220px, calc(100% - 28px)); min-height: 720px; margin: 58px auto 110px; background: var(--paper); border: 1px solid #dfe4ec; border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); }
      .screen { min-height: 720px; }
      .eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      .muted { color: var(--muted); }
      .chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 999px; background: var(--wash); color: var(--muted); font-size: 12px; font-weight: 750; }
      .chip.active { background: var(--accent-soft); color: var(--accent); }
      .chip.success { background: var(--success-soft); color: var(--success); }
      .chip.warning { background: var(--warning-soft); color: var(--warning); }
      .icon { width: 18px; height: 18px; display: inline-grid; place-items: center; font-weight: 900; }
      .button { border: 0; border-radius: 12px; padding: 11px 15px; font-weight: 800; font-size: 13px; }
      .button.primary { color: #fff; background: var(--accent); box-shadow: 0 8px 18px rgba(230,74,69,.22); }
      .button.secondary { color: var(--ink); background: var(--wash); border: 1px solid var(--line); }
      .button.ghost { color: var(--accent); background: transparent; padding-inline: 4px; }
      .state-switcher { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
      .state-switcher button { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px; padding: 7px 10px; font-size: 11px; font-weight: 750; }
      .state-switcher button.active { color: var(--accent); border-color: #f2aaa6; background: var(--accent-soft); }

      /* Variant A: familiar learning workspace with a strong exercise rail. */
      .variant-a { display: grid; grid-template-columns: 230px 1fr; }
      .a-sidebar { display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); padding: 28px 20px; background: #fcfdff; }
      .brand { display: flex; align-items: center; gap: 9px; font-weight: 900; letter-spacing: -.03em; }
      .brand-mark { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 10px; color: #fff; background: var(--accent); font-weight: 900; }
      .nav { display: grid; gap: 7px; margin-top: 42px; }
      .nav a { padding: 11px 12px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 700; }
      .nav a.current { color: var(--accent); background: var(--accent-soft); }
      .side-foot { display: grid; gap: 8px; color: var(--muted); font-size: 11px; line-height: 1.45; }
      .avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #e9edf4; color: var(--muted); font-size: 11px; font-weight: 900; }
      .a-main { padding: 34px 42px 44px; }
      .a-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 30px; }
      h1, h2, h3, p { margin: 0; }
      h1 { margin-top: 5px; font-size: clamp(26px, 3vw, 38px); letter-spacing: -.05em; }
      h2 { font-size: 18px; letter-spacing: -.03em; }
      h3 { font-size: 16px; line-height: 1.35; }
      .a-grid { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; }
      .list-panel { display: grid; align-content: start; gap: 10px; }
      .list-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 12px; font-weight: 850; }
      .exercise-row { width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; color: var(--ink); }
      .exercise-row.selected { border-color: #efaaa6; background: #fff8f7; box-shadow: 0 5px 14px rgba(230,74,69,.08); }
      .exercise-row.done { color: var(--success); }
      .exercise-row .row-copy { min-width: 0; display: grid; gap: 4px; }
      .exercise-row strong { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .exercise-row span { color: var(--muted); font-size: 10px; }
      .exercise-row.done span { color: var(--success); }
      .step { width: 20px; height: 20px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--wash); color: var(--muted); font-size: 10px; font-weight: 900; }
      .done .step { color: #fff; background: var(--success); }
      .workspace { border: 1px solid var(--line); border-radius: 20px; background: #fff; overflow: hidden; }
      .workspace-top { display: flex; justify-content: space-between; gap: 18px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
      .workspace-top small { color: var(--muted); font-size: 11px; }
      .workspace-body { padding: 23px; display: grid; gap: 18px; }
      .prompt { display: grid; gap: 8px; }
      .prompt p { color: var(--muted); font-size: 13px; line-height: 1.55; }
      .code-box { min-height: 130px; border-radius: 14px; padding: 16px; background: #182233; color: #e8eef8; font: 12px/1.75 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .code-box .kw { color: #fca5a5; } .code-box .fn { color: #93c5fd; } .code-box .num { color: #fcd34d; }
      .option-list { display: grid; gap: 8px; }
      .option { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--ink); background: #fff; font-size: 12px; font-weight: 700; }
      .option.selected { border: 2px solid var(--accent); padding: 11px; background: var(--accent-soft); }
      .radio { width: 15px; height: 15px; border: 2px solid #c3cad5; border-radius: 50%; }
      .option.selected .radio { border: 4px solid var(--accent); }
      .feedback { display: flex; align-items: flex-start; gap: 10px; border-radius: 13px; padding: 12px; background: var(--success-soft); color: var(--success); font-size: 12px; line-height: 1.4; }
      .workspace-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-top: 1px solid var(--line); }
      .hint-link { color: var(--muted); font-size: 12px; font-weight: 750; }

      /* Variant B: queue-first dashboard where the round is the primary object. */
      .variant-b { padding: 34px 42px 104px; background: #fbfcfe; }
      .b-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 28px; }
      .b-head .round-count { display: grid; justify-items: end; gap: 4px; }
      .round-count strong { color: var(--accent); font-size: 26px; letter-spacing: -.06em; }
      .round-count span { color: var(--muted); font-size: 11px; }
      .progress-track { height: 8px; width: 100%; border-radius: 99px; overflow: hidden; background: #e9edf3; }
      .progress-track span { display: block; height: 100%; width: 40%; border-radius: inherit; background: var(--accent); }
      .b-layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 22px; }
      .queue { display: grid; gap: 12px; }
      .queue-card { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 13px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
      .queue-card.current { border-color: #efaaa6; box-shadow: 0 8px 22px rgba(230,74,69,.08); }
      .queue-card .number { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); background: var(--wash); font-size: 11px; font-weight: 900; }
      .queue-card.done .number { color: #fff; background: var(--success); }
      .queue-card strong { display: block; font-size: 13px; }
      .queue-card small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
      .queue-card .status { color: var(--muted); font-size: 11px; font-weight: 800; }
      .queue-card.done .status { color: var(--success); }
      .b-rail { display: grid; align-content: start; gap: 14px; }
      .rail-card { display: grid; gap: 11px; padding: 17px; border: 1px solid var(--line); border-radius: 17px; background: #fff; }
      .rail-card h3 { font-size: 13px; }
      .rail-card p { color: var(--muted); font-size: 11px; line-height: 1.55; }
      .mini-bar { display: flex; gap: 4px; }
      .mini-bar i { display: block; width: 100%; height: 6px; border-radius: 99px; background: #e8ecf2; }
      .mini-bar i.done { background: var(--success); } .mini-bar i.current { background: var(--accent); }
      .tutor-disabled { background: #fffaf0; border-color: #f3dfae; }

      /* Variant C: calm, mobile-first route with a bottom action surface. */
      .variant-c { display: grid; grid-template-rows: auto 1fr; background: #1a2232; color: #fff; }
      .c-top { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 25px 30px; border-bottom: 1px solid rgba(255,255,255,.1); }
      .c-top .brand { color: #fff; }
      .c-top .brand-mark { background: #f56b65; }
      .c-top .chip { color: #d8deea; background: rgba(255,255,255,.08); }
      .c-main { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 30px; align-items: center; padding: 42px 56px 92px; }
      .c-copy { max-width: 620px; }
      .c-copy h1 { max-width: 580px; font-size: clamp(28px, 4.6vw, 58px); line-height: .98; letter-spacing: -.07em; }
      .c-copy p { max-width: 520px; margin-top: 18px; color: #adb9ca; font-size: 15px; line-height: 1.65; }
      .c-stepper { display: flex; align-items: center; gap: 4px; margin: 30px 0; }
      .c-stepper i { width: 32px; height: 5px; border-radius: 99px; background: #3a4659; }
      .c-stepper i.done { background: #65c98a; } .c-stepper i.current { background: #f56b65; }
      .c-question { display: grid; gap: 16px; max-width: 560px; padding: 21px; border: 1px solid rgba(255,255,255,.12); border-radius: 21px; background: rgba(255,255,255,.06); }
      .c-question h2 { font-size: 18px; }
      .c-option { display: flex; align-items: center; gap: 11px; border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 12px; color: #edf2fa; background: rgba(255,255,255,.05); font-size: 12px; }
      .c-option.selected { border-color: #f56b65; background: rgba(245,107,101,.16); }
      .c-aside { display: grid; gap: 12px; }
      .c-progress { display: grid; gap: 14px; padding: 20px; border-radius: 20px; background: #252f42; }
      .c-progress h3 { color: #fff; }
      .c-progress p { color: #aeb9ca; font-size: 12px; line-height: 1.5; }
      .c-progress strong { color: #fff; font-size: 34px; letter-spacing: -.08em; }
      .c-footer { position: fixed; z-index: 3; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 11px; padding: 9px 12px; border: 1px solid #303d53; border-radius: 999px; color: #d8e0ed; background: #111827; box-shadow: 0 12px 35px rgba(15,23,42,.28); }
      .c-footer button { width: 30px; height: 30px; border: 0; border-radius: 50%; color: #fff; background: #2b3850; font-size: 17px; }
      .c-footer span { min-width: 150px; text-align: center; font-size: 11px; font-weight: 800; }

      .empty, .complete { min-height: 650px; display: grid; place-items: center; padding: 44px; text-align: center; }
      .empty-card, .complete-card { width: min(500px, 100%); display: grid; justify-items: center; gap: 15px; padding: 42px; border: 1px solid var(--line); border-radius: 24px; background: #fff; box-shadow: 0 15px 40px rgba(23,32,51,.06); }
      .empty-illustration, .complete-illustration { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 21px; color: var(--accent); background: var(--accent-soft); font-size: 27px; }
      .complete-illustration { color: var(--success); background: var(--success-soft); }
      .empty-card p, .complete-card p { color: var(--muted); font-size: 13px; line-height: 1.6; }
      .state-overlay { position: fixed; z-index: 5; top: 12px; right: 15px; display: flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid #d8dee8; border-radius: 12px; background: rgba(255,255,255,.94); box-shadow: 0 8px 25px rgba(23,32,51,.09); }
      .state-overlay strong { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
      .state-overlay button { border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 800; }
      .state-overlay button.active { color: var(--accent); }
      .hidden { display: none !important; }

      @media (max-width: 820px) {
        .app { width: 100%; margin: 52px 0 94px; border-radius: 0; border-left: 0; border-right: 0; }
        .variant-a { display: block; }
        .a-sidebar { display: block; border-right: 0; border-bottom: 1px solid var(--line); padding: 18px 20px; }
        .nav { display: flex; margin-top: 16px; overflow-x: auto; }
        .nav a { white-space: nowrap; }
        .side-foot { display: none; }
        .a-main, .variant-b { padding: 25px 20px 100px; }
        .a-head, .b-head { display: grid; gap: 17px; }
        .a-grid, .b-layout, .c-main { grid-template-columns: 1fr; }
        .list-panel { order: 2; }
        .workspace { order: 1; }
        .b-head .round-count { justify-items: start; }
        .c-main { padding: 35px 22px 100px; }
        .c-top { padding: 20px 22px; }
        .c-aside { order: -1; }
        .c-copy h1 { font-size: 42px; }
        .state-overlay { top: 48px; right: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="prototype-note">Prototipo visual · no producción</div>
    <div class="state-overlay" aria-label="Cambiar estado del prototipo">
      <strong>Estado</strong>
      <button data-state="active">Activo</button>
      <button data-state="empty">Vacío</button>
      <button data-state="tutor-off">Tutor off</button>
      <button data-state="complete">Completada</button>
    </div>
    <main id="app" class="app"></main>
    <nav class="c-footer" aria-label="Cambiar variante visual">
      <button id="previous" aria-label="Variante anterior">‹</button>
      <span id="variant-label"></span>
      <button id="next" aria-label="Variante siguiente">›</button>
    </nav>

    <script>
      const variants = [
        { key: 'a', name: 'Mesa de trabajo' },
        { key: 'b', name: 'Bandeja de ronda' },
        { key: 'c', name: 'Ruta enfocada' },
      ];
      const stateLabels = { active: 'Activo', empty: 'Vacío', 'tutor-off': 'Tutor sin configurar', complete: 'Completada' };
      const params = new URLSearchParams(location.search);
      let variant = (params.get('variant') || 'a').toLowerCase();
      let state = params.get('state') || 'active';
      if (!variants.some((item) => item.key === variant)) variant = 'a';
      if (!stateLabels[state]) state = 'active';

      const exercises = [
        { title: 'Rango y secuencias', type: 'Selección', done: true },
        { title: 'Condicionales', type: 'Código', done: true },
        { title: 'Bucles con for', type: 'Código', done: false },
        { title: 'Listas y posiciones', type: 'Selección', done: false },
        { title: 'Funciones simples', type: 'Código', done: false },
      ];

      function setUrl(nextVariant = variant, nextState = state) {
        const next = new URL(location.href);
        next.searchParams.set('variant', nextVariant);
        next.searchParams.set('state', nextState);
        history.replaceState({}, '', next);
      }

      function shell(content, className = '') {
        return `<section class="screen ${className}">${content}</section>`;
      }

      function emptyState() {
        return `<div class="empty"><div class="empty-card">
          <div class="empty-illustration">⌁</div>
          <div class="eyebrow">Práctica</div>
          <h1>Aún no hay cursos activos</h1>
          <p>Activa un curso para que podamos preparar una ronda de ejercicios a tu medida.</p>
          <button class="button primary">Explorar cursos</button>
        </div></div>`;
      }

      function completeState() {
        return `<div class="complete"><div class="complete-card">
          <div class="complete-illustration">✓</div>
          <div class="eyebrow">Ronda completada</div>
          <h1>Buen trabajo, terminaste la ronda</h1>
          <p>Has resuelto los 10 ejercicios. Tu progreso de Práctica queda guardado por separado del progreso de los cursos.</p>
          <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center">
            <button class="button primary">Nueva ronda</button><button class="button secondary">Revisar ejercicios</button>
          </div>
        </div></div>`;
      }

      function tutorCard() {
        if (state === 'tutor-off') return `<div class="rail-card tutor-disabled"><span class="chip warning">Tutor sin configurar</span><h3>¿Quieres una pista?</h3><p>Configura tu proveedor y modelo para conversar sobre este ejercicio sin salir de la ronda.</p><button class="button secondary">Ir a configuración</button></div>`;
        return `<div class="rail-card"><span class="chip active">Tutor disponible</span><h3>¿Te atascaste?</h3><p>Pide una pista sobre el ejercicio actual. La conversación sigue asociada a su tema.</p><button class="button secondary">Abrir tutor</button></div>`;
      }

      function variantA() {
        const rows = exercises.map((item, index) => `<button class="exercise-row ${index === 2 ? 'selected' : ''} ${item.done ? 'done' : ''}">
          <span class="step">${item.done ? '✓' : index + 1}</span><span class="row-copy"><strong>${item.title}</strong><span>${item.done ? 'Resuelto' : item.type}</span></span>
        </button>`).join('');
        return shell(`<aside class="a-sidebar"><div><div class="brand"><span class="brand-mark">Py</span> Python Tutor</div><nav class="nav"><a href="#">Aprender</a><a href="#">Cursos</a><a href="#" class="current">Práctica</a><a href="#">Configuración</a></nav></div><div class="side-foot"><div class="avatar">JS</div><span>Ronda guardada · revisión 12</span></div></aside>
          <div class="a-main"><header class="a-head"><div><div class="eyebrow">Espacio de práctica</div><h1>Práctica</h1><p class="muted" style="margin-top:8px;font-size:13px">Una ronda corta para reforzar lo que ya estás aprendiendo.</p></div><div class="state-switcher"><span class="chip active">2 de 10 resueltos</span><button class="button secondary">Nueva ronda</button></div></header>
          <div class="a-grid"><div class="list-panel"><div class="list-title"><span>Ejercicios</span><span class="muted">2 / 10</span></div>${rows}<button class="button ghost">Ver pendientes ↓</button></div>
            <article class="workspace"><div class="workspace-top"><div><span class="chip active">Código</span><small style="display:block;margin-top:7px">Tema: Bucles</small></div><strong class="muted" style="font-size:12px">3 / 10</strong></div><div class="workspace-body"><div class="prompt"><h3>Completa el bucle para imprimir los números pares.</h3><p>Usa <code>range</code> y conserva el orden de salida.</p></div><pre class="code-box"><span class="kw">for</span> number <span class="kw">in</span> <span class="fn">range</span>(<span class="num">0</span>, <span class="num">10</span>):\n    <span class="kw">if</span> number % <span class="num">2</span> == <span class="num">0</span>:\n        <span class="fn">print</span>(number)</pre>${state === 'tutor-off' ? '<div class="feedback" style="background:var(--warning-soft);color:var(--warning)">⚙ El tutor necesita configuración antes de poder darte pistas.</div>' : '<div class="feedback">✦ Tu borrador se guarda mientras avanzas. Puedes pedir una pista sin perderlo.</div>'}</div><div class="workspace-actions"><span class="hint-link">▱ Pedir una pista</span><button class="button primary">Comprobar código</button></div></article></div></div>`, 'variant-a');
      }

      function variantB() {
        const cards = exercises.map((item, index) => `<button class="queue-card ${index === 2 ? 'current' : ''} ${item.done ? 'done' : ''}"><span class="number">${item.done ? '✓' : index + 1}</span><span><strong>${item.title}</strong><small>${item.type} · Tema ${index % 2 ? 'Condicionales' : 'Bucles'}</small></span><span class="status">${item.done ? 'Resuelto' : index === 2 ? 'En curso' : 'Pendiente'}</span></button>`).join('');
        return shell(`<div class="variant-b"><header class="b-head"><div><div class="eyebrow">Ronda de práctica</div><h1>Tu próxima mejor pregunta</h1><p class="muted" style="margin-top:10px;font-size:13px">Diez ejercicios elegidos de tus cursos activos.</p></div><div class="round-count"><strong>2 / 10</strong><span>resueltos</span><button class="button secondary">Nueva ronda</button></div></header><div class="progress-track" aria-label="Progreso de la ronda"><span></span></div><div class="b-layout" style="margin-top:26px"><div class="queue"><div class="list-title"><span>La ronda</span><span class="chip">Orden aleatorio</span></div>${cards}</div><aside class="b-rail"><div class="rail-card"><h3>Vista rápida</h3><div class="mini-bar">${Array.from({length:10}, (_, i) => `<i class="${i < 2 ? 'done' : i === 2 ? 'current' : ''}"></i>`).join('')}</div><p>Resueltos y pendientes en un solo lugar. Puedes entrar en cualquier ejercicio.</p></div>${tutorCard()}<div class="rail-card"><span class="chip">Guardado</span><p>Esta ronda se reanuda en el mismo punto cuando vuelvas.</p></div></aside></div></div>`, 'variant-b');
      }

      function variantC() {
        return shell(`<header class="c-top"><div class="brand"><span class="brand-mark">Py</span> Python Tutor</div><span class="chip">Práctica · 2 / 10</span></header><div class="c-main"><div class="c-copy"><div class="eyebrow" style="color:#f58c86">Una pregunta a la vez</div><h1>Haz espacio para pensar en Python.</h1><p>Una ronda mezclada de código y selección, sin perder tu hilo. Avanza a tu ritmo y vuelve cuando quieras.</p><div class="c-stepper">${Array.from({length:10}, (_, i) => `<i class="${i < 2 ? 'done' : i === 2 ? 'current' : ''}"></i>`).join('')}</div><div class="c-question"><span class="chip active">Código · Bucles</span><h2>¿Qué condición falta para imprimir solo los pares?</h2><div class="c-option selected"><span>●</span><code>number % 2 == 0</code></div><div class="c-option"><span>○</span><code>number / 2 == 0</code></div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="color:#aeb9ca;font-size:11px">▱ Pista disponible</span><button class="button primary">Comprobar</button></div></div></div><aside class="c-aside"><div class="c-progress"><span class="eyebrow" style="color:#f58c86">Tu ronda</span><strong>20%</strong><h3>2 ejercicios resueltos</h3><p>Los pendientes siguen aquí cuando estés listo.</p><button class="button secondary">Ver lista completa</button></div>${state === 'tutor-off' ? '<div class="c-progress" style="background:#3b3428"><span class="eyebrow" style="color:#f5c56f">Tutor sin configurar</span><p style="color:#e7d7b0">Configúralo para pedir pistas y conversar sobre este tema.</p></div>' : '<div class="c-progress"><span class="eyebrow" style="color:#8fddb0">Tutor listo</span><p>La conversación se mantiene con el tema aunque cambies de ejercicio.</p></div>'}</aside></div>`, 'variant-c');
      }

      function render() {
        document.querySelectorAll('[data-state]').forEach((button) => button.classList.toggle('active', button.dataset.state === state));
        const label = variants.find((item) => item.key === variant);
        document.querySelector('#variant-label').textContent = `${variant.toUpperCase()} · ${label.name}`;
        const app = document.querySelector('#app');
        if (state === 'empty') app.innerHTML = emptyState();
        else if (state === 'complete') app.innerHTML = completeState();
        else if (variant === 'a') app.innerHTML = variantA();
        else if (variant === 'b') app.innerHTML = variantB();
        else app.innerHTML = variantC();
      }

      function move(delta) {
        const index = variants.findIndex((item) => item.key === variant);
        variant = variants[(index + delta + variants.length) % variants.length].key;
        setUrl(); render();
      }

      document.querySelector('#previous').addEventListener('click', () => move(-1));
      document.querySelector('#next').addEventListener('click', () => move(1));
      document.querySelectorAll('[data-state]').forEach((button) => button.addEventListener('click', () => { state = button.dataset.state; setUrl(); render(); }));
      document.addEventListener('keydown', (event) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
        if (event.key === 'ArrowLeft') move(-1);
        if (event.key === 'ArrowRight') move(1);
      });
      render();
    </script>
  </body>
</html>
